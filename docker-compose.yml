services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alza_delivery
      POSTGRES_USER: [FILL_UP]
      POSTGRES_PASSWORD: [FILL_UP]
    ports:
      - "5432:5432"
    volumes:
      - alza_postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_preload_libraries=pg_stat_statements

volumes:
  alza_postgres_data:
